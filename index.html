<style>

--gr:#e1e0d9;--ax:#c3c2b7;--bd:rgba(11,11,11,.10);--pos:#2a78d6;--neg:#e34948;--good:#006300;

*{box-sizing:border-box}html,body{overflow-x:hidden;max-width:100%}
html{-webkit-text-size-adjust:100%}
button,.tab,summary,.copy,.tgl{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

body{margin:0;background:var(--pl);color:var(--ink);font:15px/1.55 system-ui,-apple-system,sans-serif;padding:0 0 calc(60px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;background:var(--pl);border-bottom:1px solid var(--gr);padding:calc(12px + env(safe-area-inset-top)) 14px 0}

h1{font-size:19px;margin:0 0 2px;letter-spacing:-.02em;padding-right:56px}
.sub{color:var(--mut);font-size:12px;margin:0 0 10px}
.mkt{display:inline-flex;background:var(--sf);border:1px solid var(--bd);border-radius:9px;padding:3px;gap:3px;margin-bottom:10px}

.tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--bd);background:var(--sf);color:var(--ink2);
font:600 12.5px system-ui;padding:7px 13px;border-radius:20px;cursor:pointer;white-space:nowrap}
.tab.on{border-color:var(--pos);color:var(--pos)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dot.c{background:var(--good)}.dot.p{background:transparent;border:1.5px solid var(--mut)}
.main{padding:16px 14px 0}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:17px;margin-bottom:14px;min-width:0}
h2{font-size:15px;margin:0 0 4px}h3{font-size:12.5px;margin:15px 0 7px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.hint{color:var(--mut);font-size:12.5px;margin:0 0 13px}p{margin:0 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:9px;margin-bottom:13px}
.tl{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}

.tl .n{font-size:10.5px;color:var(--ink2)}
.ctl{display:flex;align-items:center;gap:13px;flex-wrap:wrap;background:var(--sf);
border:1px solid var(--bd);border-radius:12px;padding:13px 16px;margin-bottom:14px}
.ctl label{font-size:12.5px;color:var(--ink2)}
input[type=range]{flex:1;min-width:170px;accent-color:var(--pos);height:26px}
.big{font-size:19px;font-weight:600;min-width:58px;text-align:right}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th{text-align:right;padding:7px 5px;color:var(--mut);font-weight:600;font-size:10.5px;text-transform:uppercase;
border-bottom:1px solid var(--ax);cursor:pointer;white-space:nowrap;user-select:none}
th:first-child,td:first-child{text-align:left}th:hover{color:var(--ink)}
td{padding:7px 5px;border-bottom:1px solid var(--gr);white-space:nowrap}
.up{color:var(--good);font-weight:600}.dn{color:var(--crit);font-weight:600}
.scroll{overflow-x:auto;max-width:100%}
.scroll th:first-child,.scroll td:first-child{position:sticky;left:0;background:var(--sf);z-index:2;
box-shadow:2px 0 0 var(--gr)}
.pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;border:1px solid currentColor;text-transform:uppercase;letter-spacing:.03em}
.pill.c{color:var(--good)}.pill.m{color:var(--warn)}.pill.x{color:var(--crit)}.pill.b{color:var(--pos)}
details{border-top:1px solid var(--gr)}details:first-of-type{border:0}
summary{cursor:pointer;padding:12px 0;list-style:none;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
summary::-webkit-details-marker{display:none}
summary .tk{font-size:16px;font-weight:700}summary .nm{color:var(--ink2);font-size:12.5px;flex:1}
summary .px{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.det{padding:0 0 14px}
ul{margin:0 0 10px;padding-left:18px}li{margin-bottom:5px;font-size:13px;color:var(--ink2)}li b{color:var(--ink)}
.lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:8px 0 4px}
.lbl.p{color:var(--good)}.lbl.n{color:var(--crit)}
.res{background:var(--pl);border-left:3px solid var(--ax);border-radius:0 8px 8px 0;padding:9px 12px;font-size:12.5px}
.warn{border:1px solid var(--bd);border-left:3px solid var(--warn);border-radius:8px;padding:11px 13px;font-size:12.5px;color:var(--ink2);margin:12px 0}
.warn b{color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.chip{border:1px solid var(--bd);border-radius:7px;padding:4px 9px;font:600 12px system-ui;color:var(--ink2)}
.cfgt{width:100%;font-size:12.5px;border-collapse:collapse}
.cfgt td{padding:6px 5px;border-bottom:1px solid var(--gr);white-space:normal}
.cfgt td:first-child{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.04em;width:34%;vertical-align:top}
.prompt{background:var(--pl);border:1px dashed var(--ax);border-radius:9px;padding:11px 13px;
font:12px ui-monospace,monospace;white-space:pre-wrap;color:var(--ink2);margin-top:8px}
.copy{margin-top:8px;border:1px solid var(--bd);background:var(--sf);color:var(--ink2);border-radius:7px;padding:6px 12px;font:600 12px system-ui;cursor:pointer}
.row{display:grid;grid-template-columns:110px 1fr 58px;align-items:center;gap:9px;margin-bottom:6px}
.row .l{font-size:12.5px;font-weight:600}
.bar{position:relative;height:15px;background:var(--gr);border-radius:4px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;height:100%;background:var(--pos);border-radius:4px}
.row .v{font-size:12px;text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
.prev{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--gr);align-items:start}
.prev:last-child{border:0}.prev .tx{font-size:13px;color:var(--ink2)}.prev .tx b{color:var(--ink)}
.prev .mt{font-size:10.5px;color:var(--mut);margin-top:3px}
.tgl{position:fixed;top:12px;right:12px;z-index:30;background:var(--sf);color:var(--ink2);
border:1px solid var(--bd);border-radius:7px;padding:5px 10px;font-size:11.5px;cursor:pointer}
.note{font-size:12px;color:var(--ink2);margin-top:12px;padding-top:11px;border-top:1px solid var(--gr)}
@media(max-width:640px){summary .tk{font-size:15px}.row{grid-template-columns:88px 1fr 52px}
.tab{padding:13px 16px;font-size:13px}.mkt button{padding:12px 20px;font-size:13.5px}
summary{padding:14px 0}.copy{padding:10px 16px}th,td{padding:9px 6px}
.tgl{top:calc(10px + env(safe-area-inset-top))}}
</style></head><body>

<script>

const DATA = {"meta": {"atualizado": "07/08/2026", "precos": "06/08/2026 (fechamento)", "versao": 3, "revisao": {"ativa": true, "freq": "mensal (dia 1, 09h de Brasília)", "escopo": "preços e macro atualizados, previsões conferidas, eventos do mês sinalizados"}}, "mercados": {"b3": {"nome": "Brasil · B3", "macro": {"itens": [["NTN-B 2050", "IPCA+7,30%", "curva invertida — 2032 a 8,10%"], ["CDI real", "8,48%", "Selic 14,00% · IPCA 5,0%"], ["Preços", "06/08/2026", "fechamento"], ["Revisão", "mensal", "dia 1, 09h BRT"]]}, "setores": [{"id": "eletrico", "nome": "Elétrico", "status": "completo", "data": "04/08/2026", "precos": "06/08/2026 (fechamento)", "req": 10.2, "rf": 7.16, "cfg": {"yield_real": true, "benchmark": "NTN-B casada por duração", "capital": "PL + dívida líquida", "duracao": "prazo de concessão", "modelo": "DDM 2 estágios sobre lucro distribuível", "alerta": "Preços de 06/08/2026 já refletem a reação ao 2T26 de Copel, Axia, Engie, Auren, Alupar e Energisa, mas os FUNDAMENTOS do 2T26 ainda não entraram no modelo. E o MACRO mudou desde 04/08: Selic 14,25%→14,00%, NTN-B 2050 7,16%→7,30%, CDI real 9,54%→8,48%. Os prêmios desta aba estão calculados contra a curva de 04/08 e serão recalculados na revisão mensal — a queda do CDI real baixa a barra do teste de reinvestimento"}, "resumo": "Com o ROIC medido no balanço, o prêmio médio do setor fica em torno de +0,3 p.p. sobre a NTN-B (era 1,3 p.p. quando o ROIC era suposto — medir derrubou o número). Só CPFL reinveste acima do CDI real de 9,54%. Duas compras: CPFE3 (justo R$ 63.10, +38%) e CMIG4 (justo R$ 12.93, +16%) — a 0,43 de correlação, o par mais diversificado do setor.", "pendencias": ["Fundamentos do 2T26 não incorporados (preços sim) — é o item nº 1 da próxima revisão", "CP 043/2025 da ANEEL (indenização de concessões de transmissão): evento binário de Taesa, Alupar e ISA, sem probabilidade atribuída", "Sem cenários probabilísticos nem histórico de alocação de capital das gestões"], "aprof": ["Incorporar o 2T26 completo (Taesa 11/08, Equatorial/Eneva 12/08, CPFL/Cemig 13/08) e conferir as previsões abaixo", "CP 043/2025: atribuir probabilidade e calcular impacto por ação nos dois cenários (Taesa, Alupar, ISA)", "Cenários bear/base/bull com pesos para CPFE3 e CMIG4 — hoje tudo é estimativa pontual", "Histórico de alocação de capital das gestões: a que preço recompraram, que múltiplo pagaram em M&A", "Debênture incentivada das mesmas empresas vs a ação, líquido de imposto — com prêmio de ~0,3 p.p., a comparação ficou séria"], "previsoes": [{"p": "Axia: o 1T26 foi PICO, não patamar — EBITDA regulatório do 2T26 em R$ 6,2–6,6 bi (vs 8,6 no 1T26)", "prazo": "2T26 (saiu 05/08)", "st": "verificar"}, {"p": "Taesa: alavancagem pró-forma pós-aquisição Energisa entre 4,5x e 4,8x no release do 2T26", "prazo": "11/08/2026", "st": "aberta"}, {"p": "Cemig: caixa de dividendo de 2027 já travado ~58% abaixo de 2026 (R$ 0,45/ação declarados) — novas declarações não mudam isso materialmente", "prazo": "dez/2026", "st": "aberta"}, {"p": "CPFL: lucro 2026 crescendo dois dígitos; próxima data-com só em abril/2027", "prazo": "4T26/AGO 2027", "st": "aberta"}, {"p": "Energisa: despesa financeira segue comprimindo lucro enquanto Selic > 12%; alavancagem Fitch acima de 3,9x mantém risco de novo rebaixamento", "prazo": "12 meses", "st": "aberta"}, {"p": "Se a Selic cair a ~12% em 12 meses, o setor reprecifica para cima pela duration (15–19 anos) — mais nos nomes de payout baixo (EQTL3, ENGI11), que hoje são justamente os sem prêmio", "prazo": "ago/2027", "st": "aberta"}], "acoes": [{"t": "CPFE3", "n": "CPFL Energia", "s": "Distribuição", "px": 45.85, "pj": 63.1, "up": 38, "tir": 13.1, "pr": 5.9, "roic": 17.1, "risco": 7, "dy": 9.6, "po": 75, "jcp": 0, "dur": 11.4, "ch": -10.1, "nota": 7.4, "v": "comprar", "pro": ["Único ROIC incremental realizado claramente acima do custo de capital: <b>17,1% real</b> contra WACC regulatório de 8,1%. Medido em três janelas do balanço, com alíquota normalizada.", "Melhor operação do setor: ROE de 23,7%, ROIC de 15,4%, alavancagem de 2,0x — a mais folgada entre as grandes.", "Cortes de dividendo historicamente os mais brandos: ‑12%, ‑11% e ‑4,6%, contra cortes de 60% a 70% em Copel, Cemig, Engie e Axia.", "<b>Nunca pagou JCP na década</b> — 100% dividendo, isento para PF abaixo de R$ 50 mil/mês. Numa estratégia de reinvestimento você recompõe posição com 100 centavos por real, contra 89,8 da ISA.", "Menor duration do setor (11,4 anos): num choque de +100 pb na curva real cai 10,1%, contra 39,1% da Energisa.", "Concessões de Paulista, Piratininga e RGE renovadas por 30 anos, com R$ 31,1 bi de investimento previsto até 2030 — crescimento de base regulatória, que é o crescimento de menor risco que existe.", "Lucro <b>subindo</b>: +18,2% no 1T26. É a única em que direção do lucro e valuation apontam para o mesmo lado."], "con": ["Segundo pior risco de rolagem do setor (7/10): <b>70% da dívida em CDI</b> com Selic a 14,25%, 15% vencendo em doze meses e cobertura de caixa de apenas 1,05x.", "Free float de <b>16,29%</b> — a State Grid detém 83,71%. Liquidez de R$ 51 mi/dia, prêmio de governança permanente e risco de fechamento de capital (precedente da Neoenergia).", "Pagou R$ 3,3 bi a mais de dividendo do que gerou de caixa livre em 2025, e a alavancagem subiu de 2,07x para 2,30x.", "<b>Data-com única no ano, em abril.</b> Quem compra hoje espera até abril de 2027 e não pega os R$ 2,84 bi ainda a pagar.", "As renovações só entram em vigor entre nov/2027 e out/2028."], "res": "A única com quatro argumentos independentes convergindo: mais barata, único ROIC acima do custo de capital, cortes históricos mais brandos e 100% dividendo isento. Compra o risco de que a Selic não caia.", "_l": 5.891, "_po": 0.75, "_r": 0.126}, {"t": "CMIG4", "n": "Cemig", "s": "Integrada", "px": 11.11, "pj": 12.93, "up": 16, "tir": 11.3, "pr": 4.1, "roic": 9.9, "risco": 2, "dy": 6.1, "po": 50, "jcp": 51, "dur": 15.0, "ch": -13.5, "nota": 7.9, "v": "comprar", "pro": ["Segundo melhor ROIC incremental realizado: <b>9,9% real</b>, praticamente empatado com o CDI real de 9,54%.", "<b>Segundo melhor balanço do setor</b> (2/10): alavancagem de 2,45x, prazo médio de 6,6 anos e 76% da dívida vencendo só a partir de 2029 — quase imune ao juro de hoje.", "<b>O único diversificador real da carteira.</b> Correlação de ‑0,11 a +0,43 com todo o resto do setor, contra média setorial de 0,55. Com a CPFL a correlação é de 0,43, o par mais baixo envolvendo a CPFL.", "Mais barata da tela em múltiplos de lucro, com prêmio de 4,0 p.p. sobre a NTN-B."], "con": ["<b>O dividendo em caixa de 2027 já está travado em R$ 0,45/ação — queda de 58,4% sobre 2026.</b> Não é projeção: são JCPs já declarados com pagamento diferido.", "Payout limitado a 50% até 2028 por causa do plano de capex de R$ 70 bi até 2030.", "Estado de Minas com 50,97% das ordinárias; privatização travada pela exigência constitucional de referendo.", "51% dos proventos em JCP — retém 17,5% na fonte, o que corrói o reinvestimento.", "Upside de apenas 14%, o menor entre as duas recomendadas.", "Concessões de Emborcação e Nova Ponte começam a vencer em 2027."], "res": "Barata, com o melhor perfil de dívida e o único poder real de diversificação. O preço disso é governança estatal e um dividendo que já se sabe menor em 2027.", "_l": 1.366, "_po": 0.5, "_r": 0.09}, {"t": "TAEE11", "n": "Taesa", "s": "Transmissão", "px": 39.54, "pj": 36.06, "up": -9, "tir": 9.4, "pr": 2.3, "roic": 3.8, "risco": 7, "dy": 8.4, "po": 100, "jcp": 32, "dur": 14.1, "ch": -12.9, "nota": 4.1, "v": "manter", "pro": ["Retorno total de <b>+547% em dez anos</b> (19,3% a.a. nominal, 13,4% real), contra 306% do Ibovespa e 161% do CDI, com apenas dois anos negativos em onze.", "Os dividendos acumulados de R$ 32,86 por unit devolveram <b>196% do preço de 2015</b> — quase o dobro do capital, só em caixa.", "Paga 100% do lucro regulatório, o que é a política <b>correta</b> para quem reinveste a 3,8% real: devolve o capital para você aplicar a 9,54%.", "A RAP subiu 47% em nove ciclos apesar de todos os degraus — o modelo de 'ativo em run-off' que sustentou seis anos de recomendação de venda estava simplesmente errado.", "A mais previsível do setor: proventos trimestrais atrelados ao balanço. Declara junto com o 2T26 em 11/08."], "con": ["<b>ROIC incremental realizado de apenas 3,8% real</b> — destrói valor a cada real reinvestido.", "<b>Pior balanço do setor</b> (7/10): 4,2x dívida líquida/EBITDA, e a aquisição da Energisa pode levar a ~4,7x.", "44% da RAP vence entre 2030 e 2032, sem precedente de indenização — a CP 043/2025 da ANEEL propõe indenizar só os ativos incrementais.", "55% da RAP indexada ao IGP-M, que roda a 2,77% contra IPCA de 4,4% — erosão real de ~0,9% ao ano.", "<b>CAGR do dividendo de 2,0% em dez anos</b>: paga muito e paga sempre, mas o provento perde poder de compra.", "Negocia 9% acima do meu preço justo."], "res": "O caso que provou que o sell-side estava errado, e que hoje não está barata. Boa para quem já tem; não é ponto de entrada. A aquisição da Energisa melhora o perfil (duração 12,3→12,9 anos, IGP-M de 55% para 52%) mas é pequena demais para resolver o penhasco.", "_l": 3.338, "_po": 1.0, "_r": 0.06}, {"t": "AXIA3", "n": "Axia Energia", "s": "Geração", "px": 53.17, "pj": 34.76, "up": -35, "tir": 7.3, "pr": 0.1, "roic": null, "risco": 1, "dy": 6.1, "po": 100, "jcp": 0, "dur": 19.5, "ch": -18.2, "nota": 4.1, "v": "passar", "pro": ["<b>Melhor balanço do setor por larga margem</b> (1/10): 1,8x de alavancagem, custo de dívida de CDI+0,03% e R$ 27,7 bi em caixa, que cobrem 2026, 2027 e 2028 sem captar nada.", "A descotização é real e já apareceu no caixa: FCO saiu de R$ 4,8 bi (2022) para R$ 14,5 bi (2025); no 1T26 o EBITDA regulatório subiu 60% e a margem foi de 56% para 74%.", "A estrutura de resgate das ações classe C (AXIA7) pagou <b>imposto efetivo de 0,74%</b> — R$ 52,00 com custo de R$ 49,44, tributando só o ganho. É a devolução de capital mais eficiente do mercado.", "100% dividendo, sem JCP. Redução de R$ 14,8 bi na provisão de empréstimos compulsórios desde 2022."], "con": ["<b>O motor da tese acaba em 2027.</b> São 1.313 MW médios descotizados por ano desde 2023; em 2027 chega a zero. Depois, o crescimento depende só de preço de energia.", "O 1T26 foi pico, não patamar: margem unitária de R$ 171/MWh contra R$ 36/MWh no ano anterior. O Goldman já cortou o EBITDA do 2T26 de R$ 6,7 bi para R$ 6,2 bi.", "Subiu 91% em doze meses e implica prêmio de <b>0,1 p.p.</b> sobre o título público — a tese já está no preço.", "Virou proxy de preço de energia, com a volatilidade que isso traz.", "A indenização do RBSE de R$ 5,3 bi/ano acaba em junho de 2028.", "Dividendo errático: R$ 0,22 a R$ 4,54 por ano na década."], "res": "Empresa excelente, preço sem margem. Reporta em 05/08 — se o 2T26 confirmar que o 1T26 foi pico, o preço justo cai ainda mais. Só voltaria a olhar perto de R$ 35.", "_l": 3.2178, "_po": 1.0, "_r": 0.081}, {"t": "CPLE3", "n": "Copel", "s": "Integrada", "px": 14.9, "pj": 9.09, "up": -39, "tir": 7.0, "pr": -0.2, "roic": 5.2, "risco": 3, "dy": 5.0, "po": 75, "jcp": 50, "dur": 16.6, "ch": -15.5, "nota": 3.0, "v": "passar", "pro": ["O <b>LRCAP é o melhor reinvestimento contratado do setor</b>: ampliação de Foz do Areia e Segredo, 1.862,8 MW contratados, R$ 2,6 bi/ano por 15 anos a partir de agosto de 2030, a retorno real de 20% a 28%. É upside genuíno, fora do meu modelo.", "Política de dividendos com piso de 75% do lucro ajustado, alavancagem-alvo de 2,9x e prazo de convergência esticado para 48 meses — comprou espaço para pagar enquanto investe.", "Recompra de até 285,5 milhões de ações aprovada, vigente até nov/2027.", "Corporation no Novo Mercado, classe única, sem controlador."], "con": ["<b>ROIC incremental realizado de 5,2% real</b> — eu usava 22% baseado no LRCAP e errei feio. O histórico de dez anos não sustenta a premissa de reinvestimento de alto retorno.", "Negocia a 16x lucro contra ~9x da média setorial. O mercado já pagou pelo LRCAP adiantado.", "Prêmio de risco de <b>‑0,1 p.p.</b> — literalmente zero sobre o título público.", "50% dos proventos em JCP.", "O Itaú BBA está em R$ 14,50 — sem upside nenhum."], "res": "Boa empresa, tese real, preço sem desconto. O LRCAP justifica olhar de novo se o papel voltar para a casa dos R$ 12-13.", "_l": 0.9983, "_po": 0.75, "_r": 0.066}, {"t": "ALUP11", "n": "Alupar", "s": "Transmissão", "px": 32.51, "pj": 15.09, "up": -54, "tir": 6.2, "pr": -1.0, "roic": 0.7, "risco": 2, "dy": 2.8, "po": 35, "jcp": 0, "dur": 19.0, "ch": -17.9, "nota": 3.1, "v": "passar", "pro": ["Balanço muito sólido (2/10): apenas 12,4% da dívida em CDI e caixa cobrindo 3,5x o curto prazo.", "100% dividendo, sem JCP — eficiente para reinvestimento.", "Venceu o Lote 7 em julho de 2026 a TIR alavancada estimada de 13,1%.", "Exposição de ~18% da RAP aos ativos que vencem em 2030-32, contra 44% da Taesa."], "con": ["<b>ROIC incremental realizado de 0,7% real — o segundo pior do setor — e retém 65% do lucro.</b> É a pior combinação possível: prende o seu capital a um retorno que você bateria com folga no Tesouro.", "Eu a coloquei em primeiro no ranking de qualidade usando 13,1% de ROIC baseado em um único leilão. O balanço de dez anos diz 0,7%. Foi o meu maior erro nesta análise.", "Negocia 54% acima do meu preço justo.", "DY de 2,8% não compensa a espera, e o dividendo caiu em 2024 e 2025."], "res": "Mudei de ideia. Era minha primeira colocada em qualidade e passou a ser um caso de retenção de capital destrutiva. Balanço bom não compensa reinvestir a 0,7% real com CDI a 9,54%.", "_l": 2.5795, "_po": 0.35, "_r": 0.044}, {"t": "ISAE4", "n": "ISA Energia", "s": "Transmissão", "px": 26.65, "pj": 18.03, "up": -32, "tir": 7.5, "pr": 0.3, "roic": 0.1, "risco": 5, "dy": 5.8, "po": 75, "jcp": 58, "dur": 18.3, "ch": -17.0, "nota": 2.9, "v": "passar", "pro": ["Maior duração contratual do setor: 18,3 anos, com a Concessão Paulista indo até dezembro de 2042.", "Negocia abaixo do valor patrimonial (P/VP de 0,85).", "Ritmo de proventos quase mensal em 2025 e 2026."], "con": ["<b>Fluxo de caixa operacional NEGATIVO em 2024 e 2025</b> (‑R$ 182 mi e ‑R$ 1.220 mi). Está pagando dividendo e financiando R$ 5,1 bi de capex com dívida e emissão de ações.", "<b>ROIC incremental realizado de 0,1% real — o pior do setor.</b>", "A indenização do RBSE, de ~R$ 1,9 bi/ano, <b>acaba em 30/06/2028</b>.", "O TRF1 anulou em 26/05/2026 a cobrança do custo de capital próprio sobre os ativos RBSE, com devolução aos consumidores.", "Follow-on de R$ 1,2 bi em 24/07/2026 — diluição direta do dividendo por ação.", "Lucro do 2T26 caiu 32%. E 58% dos proventos em JCP: sobram 89,8 centavos por real para reinvestir, o pior do setor.", "Alavancagem de 3,78x."], "res": "A ação mais barata do setor pelo patrimônio e a pior pelo caixa. Barato no balanço não é barato no caixa.", "_l": 2.0713, "_po": 0.75, "_r": 0.041}, {"t": "EGIE3", "n": "Engie Brasil", "s": "Geração", "px": 29.91, "pj": 14.12, "up": -53, "tir": 6.0, "pr": -1.2, "roic": 2.0, "risco": 4, "dy": 3.5, "po": 55, "jcp": 11, "dur": 25.7, "ch": -24.2, "nota": 2.3, "v": "passar", "pro": ["Ativos de qualidade, com 70-75% do portfólio em hidrelétricas e ROE de 18,9%.", "53% da dívida em IPCA, o que reduz a sensibilidade à Selic.", "Pipeline de transmissão entrando em operação (Asa Branca, Graúna, Colibri)."], "con": ["<b>A própria empresa projeta curtailment de 26% em 2026 e 32% em 2027</b>, e o diretor de renováveis declarou que 'não existe projeto que se sustente' nesse patamar.", "Follow-on de julho diluiu os acionistas em ~25% para incorporar Jirau.", "Payout travado no piso de 55%, reafirmado pelo CFO para 2026.", "<b>ROIC incremental realizado de 2,0% real.</b>", "CAGR do dividendo de ‑0,7% em dez anos: o provento encolheu em termos nominais.", "Duration de 25,7 anos — cai 24,2% num choque de +100 pb.", "Consenso de mercado em neutro/venda."], "res": "Três ventos contra simultâneos — curtailment estrutural, diluição e payout travado — com o menor retorno implícito entre as geradoras.", "_l": 1.9263, "_po": 0.55, "_r": 0.051}, {"t": "ENEV3", "n": "Eneva", "s": "Geração térmica", "px": 26.6, "pj": 6.28, "up": -76, "tir": 5.1, "pr": -2.1, "roic": null, "risco": 6, "dy": 0.0, "po": 0, "jcp": 0, "dur": 28.0, "ch": -26.6, "nota": 1.4, "v": "passar", "pro": ["R$ 161,1 bi de receita fixa contratada no LRCAP — transformacional em escala.", "Recompra de até 23,1 milhões de ações aprovada em junho de 2026.", "Lucro do 1T26 subiu 36%."], "con": ["<b>Nunca pagou dividendo desde 2009.</b> Payout zero, com R$ 18,2 bi de capex que só vira caixa a partir de 2028 — você financia e espera.", "Subiu 86% em doze meses e implica <b>‑2,0 p.p. de prêmio</b> sobre o título público.", "<b>Não divulga cronograma de vencimento de dívida, indexador, custo nem covenant.</b> É a única do setor com opacidade desse nível — e isso por si só justifica desconto.", "Duration de 28 anos: cai 26,6% num choque de +100 pb."], "res": "Tese industrial legítima, preço que já embute a execução perfeita de um capex que ainda não começou a gerar caixa. E opacidade de crédito inaceitável.", "_l": 0.8128, "_po": 0.0, "_r": 0.081}, {"t": "EQTL3", "n": "Equatorial", "s": "Distribuição", "px": 38.43, "pj": 10.05, "up": -74, "tir": 4.8, "pr": -2.4, "roic": 2.8, "risco": 5, "dy": 1.0, "po": 25, "jcp": 34, "dur": 28.9, "ch": -27.6, "nota": 1.8, "v": "passar", "pro": ["Melhor operadora de distribuição do país em recuperação de ativos problemáticos, com histórico de turnaround comprovado.", "Reciclagem de capital bem executada: vendeu transmissão para a CDPQ por R$ 5,38 bi com TIR real implícita de ~36%.", "Retorno total de 602% em dez anos."], "con": ["<b>Pior fluxo de caixa livre do setor: ‑R$ 7,0 bi em 2025</b>, com gap de R$ 8,8 bi entre caixa gerado e dividendo pago.", "<b>ROIC incremental realizado de 2,8% real e retém 75% do lucro</b> — prende capital a retorno baixo.", "Concentração crescente em saneamento (Sabesp + R$ 5,6 bi na Copasa), setor mais intensivo em capital e regulatoriamente menos maduro.", "<b>Excluindo 2025, o DY nunca passou de 3,6% na década.</b> Não é ação de dividendo, e a administração tentou reduzir o dividendo obrigatório de 25% para 1%.", "Volatilidade de dividendo de 1,15 — a maior do setor.", "Duration de 28,9 anos e prêmio de ‑2,4 p.p."], "res": "Compounder de verdade com gestão respeitada, mas a preço que exige perfeição e num momento em que o acionista financia em vez de receber.", "_l": 1.6052, "_po": 0.25, "_r": 0.054}, {"t": "ENGI11", "n": "Energisa", "s": "Distribuição", "px": 49.46, "pj": 12.35, "up": -75, "tir": 4.7, "pr": -2.5, "roic": 5.2, "risco": 9, "dy": 1.0, "po": 30, "jcp": 0, "dur": 40.9, "ch": -39.1, "nota": 0.3, "v": "passar", "pro": ["Nove concessões renovadas por 30 anos, com R$ 18 bi de capex comprometido até 2030.", "Volume crescendo 4,5%, com todas as concessões em expansão.", "Vendeu cinco transmissoras à Taesa a 10x EBITDA, acima dos 7-8x do consenso — boa alocação de capital.", "100% dividendo, sem JCP."], "con": ["<b>A Fitch rebaixou o rating em 30/04/2026</b>, de AAA(bra) para AA+(bra). A folga para o gatilho da própria Fitch é de 0,1x.", "<b>Pior retorno implícito do setor: 4,6% real, ou 2,5 p.p. ABAIXO do título público.</b>", "Lucro recorrente caiu 46,9% no 1T26; despesas financeiras subiram 67,8%, com ~75% da dívida em CDI.", "Perdas acima do teto regulatório em Mato Grosso e Rondônia — perda acima do limite não é repassável.", "<b>Duration de 40,9 anos: cai 39,1% num choque de +100 pb na curva real.</b> É a mais frágil do setor a juros, e a que já paga menos que o soberano.", "FCF projetado pela Fitch em ‑R$ 3,3 bi (2026) e ‑R$ 2,2 bi (2027)."], "res": "A pior combinação do setor: valuation mais esticado, crédito deteriorando e máxima sensibilidade a juros. Os alvos de R$ 77-88 do sell-side exigem premissas que nenhuma taxa razoável reproduz.", "_l": 1.6446, "_po": 0.3, "_r": 0.067}]}, {"id": "saneamento", "nome": "Saneamento", "status": "completo", "data": "07/08/2026", "precos": "06/08/2026 (fechamento)", "req": 10.3, "rf": 7.3, "cfg": {"yield_real": true, "benchmark": "NTN-B casada por duração", "capital": "PL + dívida líquida", "duracao": "prazo de concessão / metas de universalização", "modelo": "DDM 2 estágios", "alerta": "Duas mudanças de universo desde a aba pendente: a COPASA foi PRIVATIZADA em 16/06/2026 (Equatorial 30% a R$ 49,03) e a AMBIPAR está em recuperação judicial desde out/2025, negociando abaixo de R$ 1,00 — fora do modelo. A SABESP desdobrou 1:5 em 29/04/2026: quem comparar com preço-alvo antigo erra por 5 vezes"}, "resumo": "Com o ROIC medido no balanço, o prêmio médio do setor é de −0,4 p.p. sobre a NTN-B casada por duração — mas isso inclui a Orizon, que nunca pagou dividendo; entre as três de água e esgoto o prêmio é de +1,0 p.p. <b>Nenhuma das quatro reinveste acima do CDI real de 8,48%</b>: Sabesp 8,2%, Sanepar 8,1%, Copasa 7,6%, Orizon 4,6%. O achado mais duro é a Copasa: o mercado paga hoje R$ 63,35, 29% acima dos R$ 49,03 que a Equatorial pagou sete semanas antes — e o comprador estratégico levou controle e acordo de acionistas que o minoritário não tem. <b>Nenhuma compra.</b> Sanepar é a única com prêmio decente (+2,7 p.p.) e a única que autofinancia o capex, mas a AGEPAR acabou de devolver 100% do precatório de R$ 4 bi aos usuários e o reajuste de 2026 foi de 2,50% contra IPCA de 5,0% — repasse real negativo. Este não é hoje um setor de dividendos: o maior DY da tela é 2,9%.", "pendencias": ["Correlação entre os pares NÃO foi calculada — não levantei série de retornos anuais. Sem isso não sei quanto de diversificação real existe entre SBSP3, CSMG3 e SAPR11, e o método é explícito em não presumir", "2T26 sai entre 12 e 14/08/2026 (Sabesp 12, Sanepar 13, Copasa 14) e não está incorporado em nenhuma das três", "A incorporação das ações da EMAE pela Sabesp foi aprovada na AGE de 30/07/2026 mas depende da AGE da EMAE (adiada 30 dias pela CVM). Vai aumentar o capital e a contagem de ações — não modelei a diluição", "Orizon tem desdobramento 1:4 aprovado pelo conselho em 10/07/2026 e bônus de subscrição (ORVR11) negociando desde 11/05 — não modelei a diluição nem o efeito do split", "Cronograma de vencimento de dívida ano a ano e percentual por indexador não foram levantados para nenhuma das quatro — o risco de balanço aqui é nota qualitativa, não perfil medido", "Não comparei com as debêntures incentivadas das próprias empresas, que é o teste mais duro com prêmio de 1 p.p."], "aprof": ["Incorporar o 2T26 das três (12–14/08) e conferir as previsões abaixo", "Calcular a matriz de correlação dos retornos anuais — é a lacuna nº 1 desta análise", "Sanepar: medir o repasse REAL de inflação em 10 anos (tarifa média vs IPCA). O IRT 2026 de 2,50% contra IPCA de 5,0% sugere que a premissa de yield real do setor não vale para o Paraná — se o repasse for parcial, o prêmio de +2,7 p.p. encolhe", "Copasa sob controle privado: qual payout a Equatorial vai praticar? Ela mesma paga 25% na EQTL3. Se a Copasa convergir para lá, o DY cai de 2,8% para ~1,4%", "Sabesp: cronograma de desalavancagem. A dívida bruta saiu de R$ 25,3 bi (2024) para R$ 51,6 bi (1T26) — a que ND/EBITDA a administração pretende estabilizar, e em que ano", "Perfil de vencimento e indexador da dívida das quatro, com ação de rating recente (Fitch avaliou a Sanepar em 02/06/2026; Moody's reafirmou Copasa em Aaa.br em 23/06/2026)"], "previsoes": [{"p": "Sabesp: EBITDA ajustado do 2T26 entre R$ 3,5 bi e R$ 4,1 bi (1T26 foi R$ 3,8 bi, +26% a/a)", "prazo": "12/08/2026", "st": "aberta"}, {"p": "Sabesp: dívida bruta ultrapassa R$ 60 bi até a divulgação do 4T26 (1T26: R$ 51,6 bi)", "prazo": "4T26 (mar/2027)", "st": "aberta"}, {"p": "Sanepar: o mandado de segurança contra a AGEPAR não reverte a destinação integral do precatório de R$ 4 bi até 31/12/2026 — a companhia não retém os 25% que pleiteia", "prazo": "dez/2026", "st": "aberta"}, {"p": "Sanepar: lucro líquido do 2T26 abaixo de R$ 400 mi (TTM roda a ~R$ 305 mi/tri desde o 2T25)", "prazo": "13/08/2026", "st": "aberta"}, {"p": "Copasa: payout declarado sobre o exercício de 2026 fica ABAIXO de 50% do lucro líquido, sob a nova estrutura de controle (Equatorial 30% + Perfin 12,76%)", "prazo": "AGO de 2027", "st": "aberta"}, {"p": "Orizon não distribui dividendo em 2026 — será o 16º ano consecutivo sem provento, com prejuízos acumulados ainda em absorção", "prazo": "dez/2026", "st": "aberta"}, {"p": "Se a Selic cair a 12% em 12 meses, o setor reprecifica para cima pela duration (19–27 anos), e MAIS na Copasa (27,2 anos) do que na Sanepar (19,2) — apesar de a Copasa ser a mais cara hoje", "prazo": "ago/2027", "st": "aberta"}], "acoes": [{"t": "SAPR11", "n": "Sanepar", "s": "Água e esgoto · PR", "px": 34.83, "pj": 33.48, "up": -4, "tir": 10.1, "pr": 2.7, "roic": 8.1, "risco": 3, "dy": 2.9, "po": 25, "jcp": 100, "dur": 19.2, "ch": -17.5, "nota": 6.2, "v": "manter", "_l": 4.05, "_po": 0.25, "_r": 0.0807, "pro": ["<b>Maior prêmio da tela: +2,7 p.p.</b> sobre a NTN-B casada aos 19,2 anos de duração (7,40%). TIR real implícita de 10,1% ao preço de R$ 34,83.", "<b>A única que autofinancia o capex</b>: FCO de R$ 2,8 bi contra capex de ~R$ 2,4 bi/ano — 117% de cobertura. Sabesp cobre 55%, Copasa 97%, Orizon 35%.", "Menor alavancagem do setor por larga margem: <b>dívida líquida/EBITDA de 0,64x</b>, contra 2,31x da Sabesp e 2,34x da Copasa.", "ROIC incremental medido de <b>8,1% real</b>, em três janelas do balanço (2016-25: 14,6%; 2018-25: 12,4%; 2020-25: 13,3% nominais), com alíquota normalizada em 23,5% — necessário, porque a alíquota de 2025 foi de 9,7% por conta do precatório.", "Negocia a <b>0,83x o valor patrimonial</b>, a única do setor abaixo de 1."], "con": ["<b>A premissa de yield real do setor não se confirma no Paraná.</b> O IRT 2026 homologado pela AGEPAR foi de 2,4993%, contra IPCA de 5,0% — erosão real de ~2,4 p.p. em um ano. Se o repasse é parcial, o prêmio de +2,7 p.p. está superestimado.", "<b>A AGEPAR destinou 100% do precatório de R$ 4 bi aos usuários</b> em 23/06/2026 (50% investimento não oneroso, 50% desconto de 25% na tarifa mínima). A companhia esperava reter 25% e entrou com mandado de segurança em 17/04.", "<b>Não declarou JCP referente ao 1º semestre de 2026</b> (fato relevante de 25/06). O DY de 12 meses é de 1,5% — o menor entre as três de água e esgoto.", "A queda da dívida líquida de R$ 4,83 bi para R$ 1,92 bi é caixa de precatório que a AGEPAR mandou devolver: o balanço parece mais folgado do que é.", "Governança Nível 2, não Novo Mercado, e SAPR11 é unit (1 ON + 4 PN) — os direitos da classe precisam ser lidos no estatuto antes de qualquer posição, e eu não li.", "Estado do Paraná em emergência hídrica declarada por decreto (30/04/2026) — risco operacional e de custo fora do modelo.", "Retém 75% do lucro para reinvestir a 8,1% real, contra CDI real de 8,48%. Prende seu capital a um retorno que você bateria sem risco."], "res": "O melhor prêmio e o melhor balanço da tela, ao preço de ter o regulador mais hostil do setor — a AGEPAR acabou de tomar R$ 4 bi e conceder reajuste abaixo da inflação. Preço justo de R$ 33,48 contra R$ 34,83: está no preço. Manter, não comprar."}, {"t": "SBSP3", "n": "Sabesp", "s": "Água e esgoto · SP", "px": 27.39, "pj": 21.06, "up": -23, "tir": 8.8, "pr": 1.4, "roic": 8.2, "risco": 6, "dy": 2.6, "po": 28, "jcp": 100, "dur": 21.4, "ch": -19.6, "nota": 6.0, "v": "passar", "_l": 2.5, "_po": 0.28, "_r": 0.082, "pro": ["<b>Melhor ROIC incremental medido do setor: 8,5% real</b> — o único claramente acima do WACC regulatório da própria agência (ARSESP, 7,86% real pós-imposto). Medido no balanço com capital saindo de R$ 25,5 bi (2016) para R$ 70,2 bi (2025).", "A execução pós-privatização aparece no caixa: FCO de R$ 8,36 bi em 2025 contra R$ 4,85 bi em 2023, e EBITDA do 1T26 de R$ 3,8 bi (+26% a/a) com lucro ajustado de R$ 1,55 bi (+32%).", "<b>Meta de universalização em 2029</b>, quatro anos antes do prazo legal de 2033 — e já superou todas as metas do Fator-U de 2025 (economias de água 152% da meta, esgoto 133%).", "Investiu R$ 15,2 bi em 2025, 2,2x os R$ 6,9 bi de 2024. Base de ativos regulatória crescendo é o crescimento de menor risco que existe.", "Novo Mercado, tag along de 100%, free float de 100% e liquidez de R$ 355 mi/dia — a mais negociável do setor por ordem de grandeza."], "con": ["<b>Negocia 30% acima do meu preço justo de R$ 21,06</b> a 10,3% de exigência. Prêmio de apenas +1,4 p.p. sobre a NTN-B casada.", "<b>A dívida bruta saiu de R$ 25,3 bi (2024) para R$ 51,6 bi (1T26)</b> — dobrou em 18 meses. O FCF de 2025 foi de −R$ 6,8 bi e ainda pagou ~R$ 2,45 bi de proventos: o dividendo sai da dívida, não do caixa.", "Mantido o gap de capex, a alavancagem vai de 2,31x para ~3,8x dívida líquida/EBITDA em três anos.", "<b>Duração de 21,4 anos</b>: num choque de +100 pb na curva real, o preço justo cai 19,6%.", "O EBIT de 2024 (R$ 15,5 bi) tem item não recorrente do novo contrato URAE-1 — o 3T24 sozinho teve R$ 9,86 bi de EBIT. Parte da receita atual é receita de construção casada com custo, o que infla margem e EBITDA sem gerar caixa livre.", "<b>DY de 2,6%</b> e payout de 28%: retém 72% para reinvestir a 8,2% real, ligeiramente abaixo do CDI real de 8,48%.", "A incorporação das ações da EMAE, aprovada na AGE de 30/07/2026, aumenta capital e contagem de ações — diluição ainda não quantificada.", "Desdobramento 1:5 em 29/04/2026: qualquer preço-alvo anterior a essa data precisa ser dividido por 5 antes de comparar."], "res": "A melhor empresa do setor pelos números que eu consigo medir, ao preço que já embute a execução. A conclusão inverte com a exigência: a 8,8% o justo é R$ 27,65 e ela está exatamente no preço; a 11,8%, R$ 16,67. Passo a 10,3%, mas esta é a que eu voltaria a olhar primeiro numa correção."}, {"t": "CSMG3", "n": "Copasa", "s": "Água e esgoto · MG", "px": 63.35, "pj": 30.47, "up": -52, "tir": 6.4, "pr": -1.0, "roic": 7.6, "risco": 4, "dy": 2.8, "po": 50, "jcp": 100, "dur": 27.2, "ch": -25.5, "nota": 3.5, "v": "passar", "_l": 3.56, "_po": 0.5, "_r": 0.0759, "pro": ["Privatizada em 16/06/2026: o Estado de Minas saiu de 50,03% para 5% + golden share, com Equatorial em 30% e fundos Perfin em 12,76%. O CADE aprovou sem restrições em 05/08/2026.", "Moody's Local reafirmou o rating <b>Aaa.br com perspectiva estável</b> em 23/06/2026 — o melhor crédito do setor.", "Novos contratos de concessão com <b>Contagem e Betim</b> assinados em 31/07/2026, duas das maiores cidades da região metropolitana.", "Autofinancia 97% do capex (FCO de R$ 2,33 bi contra ~R$ 2,4 bi), com alavancagem de 2,34x.", "Retorno total de 1.185% em dez anos, com alta de 47% só em 2026."], "con": ["<b>O mercado paga R$ 63,35 hoje contra os R$ 49,03 que a Equatorial pagou em 16/06 — 29% a mais, sete semanas depois.</b> Na minha modelagem, a R$ 49,03 a TIR real era de 7,50% (prêmio de +0,2 p.p.); a R$ 63,35 é de 6,38% (prêmio de −0,9 p.p.). São 1,1 p.p. de TIR a favor de quem entrou no follow-on.", "E o comprador estratégico levou <b>30% mais acordo de acionistas</b>. O minoritário compra o mesmo fluxo de caixa sem controle, sem assento garantido e sem sinergia.", "<b>ROIC incremental medido de 7,2% real, ABAIXO do WACC regulatório de ~8,0%.</b> Destrói valor na margem a cada real reinvestido, e retém metade do lucro.", "<b>Único prêmio negativo entre as três de água e esgoto: −1,0 p.p.</b> sobre a NTN-B casada aos 27,2 anos.", "Maior duração do setor (27,2 anos): num choque de +100 pb, cai 25,5%.", "Dívida líquida saiu de R$ 3,71 bi (2023) para R$ 6,86 bi (1T26), com dívida bruta em R$ 9,37 bi — quase dobrou em dois anos, e pagou waiver fee em nove emissões de debêntures em junho de 2026.", "Payout de 50% é premissa minha: a Equatorial pratica 25% na própria EQTL3. Se convergir, o DY cai de 2,8% para ~1,4%."], "res": "Mudei de ideia no meio da análise. Entrei achando que a privatização era o gatilho e saí com o oposto: o gatilho já foi pago, e pago acima do que o comprador informado pagou. Boa empresa, crédito Aaa.br, mas a 63 reais o comprador de hoje aceita menos retorno que o título público de duração equivalente."}, {"t": "ORVR3", "n": "Orizon", "s": "Resíduos e biogás", "px": 71.08, "pj": 2.52, "up": -96, "tir": 2.6, "pr": -4.8, "roic": 1.2, "risco": 7, "dy": 0.0, "po": 0, "jcp": 0, "dur": 179.2, "ch": 0, "nota": 1.8, "v": "passar", "_l": 0.62, "_po": 0.0, "_r": 0.046, "pro": ["Crescimento real de preço: no 1T26 o preço médio de destinação subiu 10,3% a/a, <b>ganho real de 5,9%</b> — repasse acima da inflação, o oposto da Sanepar.", "Receita do 1T26 de R$ 331 mi (+37,5%), EBITDA de R$ 143 mi (+30,5%) e reversão do prejuízo do 1T25.", "Concessão de Maceió prorrogada até <b>2054</b> com recomposição econômico-financeira, em 30/03/2026.", "Incorporação da Vital cria uma companhia com mais de R$ 3 bi de receita; ratings brAA+ na 6ª emissão de debêntures."], "con": ["<b>ROIC incremental medido de 1,2% real</b> — o pior de longe. O capital investido saiu de R$ 424 mi (2018) para R$ 2,82 bi (2025) e o NOPAT não acompanhou. Contra um custo de capital de ~8%, são 6,8 p.p. de destruição na margem.", "<b>Nunca pagou dividendo</b>, e os prejuízos acumulados ainda estão em absorção — a AGO de 27/04/2026 destinou o resultado de 2025 exatamente para isso. Payout zero não é escolha de alocação, é impossibilidade contábil.", "<b>Fora do ranking por DDM.</b> Com payout zero, todo o valor está na perpetuidade e a duração calculada dá 179 anos — número sem significado econômico. O prêmio de −4,8 p.p. está medido contra o vértice longo, não casado por duração.", "P/L de 115 sobre o lucro dos últimos doze meses (R$ 100 mi consolidado, R$ 85 mi dos controladores).", "FCF de −R$ 457 mi e alavancagem de 3,32x sobre o EBITDA anualizado.", "<b>Dois eventos societários pendentes que mudam a contagem de ações</b>: desdobramento 1:4 aprovado pelo conselho em 10/07/2026 e bônus de subscrição ORVR11 negociando desde 11/05/2026. A contagem de 137.324.101 ações é pré-split.", "Classificada em 'Água e Saneamento' pela B3, mas é resíduos e energia — não tem tarifa regulada por agência estadual nem base de remuneração regulatória. A adaptação do setor não se aplica a ela."], "res": "Tese industrial legítima com ganho real de preço, dentro de um balanço que reinveste a 1,2% real e nunca devolveu um centavo. Não é comparável às três de água e esgoto e não deveria estar no mesmo ranking — está aqui para registrar por que fica de fora."}]}, {"id": "concessoes", "nome": "Rodovias & Concessões", "status": "pendente", "bloco": 1, "universo": ["CCRO3", "ECOR3", "MOTV3"], "racional": "Tarifa indexada e prazo explícito — mesma matemática de duração. Ciclo de releilões em andamento.", "aprof": ["Perfil de vencimento trecho a trecho (como fizemos com a RAP da Taesa) e o que os releilões pagam", "Aditivos e reequilíbrios: quanto do valuation depende de renegociação vs contrato original", "Elasticidade tráfego×PIB medida, não suposta", "Motiva pós-fusão: governança e sinergia prometida vs realizada"], "cfg": {"yield_real": true, "benchmark": "NTN-B casada por duração", "capital": "PL + dívida líquida", "duracao": "prazo de concessão por trecho", "modelo": "DDM 2 estágios", "alerta": ""}}, {"id": "telecom", "nome": "Telecom", "status": "pendente", "bloco": 1, "universo": ["VIVT3", "TIMS3"], "racional": "Capex alto, dividendo relevante, repasse parcial de inflação — testa onde a premissa de indexação quebra.", "aprof": ["Medir o repasse REAL: preço médio por usuário vs IPCA em 10 anos (é o teste do yield real)", "Capex 5G declinante → inflexão de FCF: quantificar e datar", "Competição de ISPs regionais em fibra: erosão de share mensurável", "Payout econômico com recompras (Vivo) vs só dividendo"], "cfg": {"yield_real": true, "benchmark": "NTN-B com desconto de repasse", "capital": "PL + dívida líquida", "duracao": "vida útil de espectro/rede", "modelo": "DDM 2 estágios", "alerta": "Repasse de inflação é parcial — validar antes de tratar yield como real"}}, {"id": "bancos", "nome": "Bancos", "status": "pendente", "bloco": 2, "universo": ["ITUB4", "BBDC4", "BBAS3", "SANB11", "BPAC11", "ABCB4"], "racional": "Com Selic a 14,25%, é o candidato mais óbvio a ter prêmio de risco de verdade — o teste de se o problema era do elétrico ou da bolsa inteira.", "aprof": ["Custo do risco NORMALIZADO por ciclo (a armadilha é lucro de pico antes da inadimplência virar)", "Sensibilidade do NII à queda da Selic banco a banco — quem ganha e quem perde com juro caindo", "ROE incremental sobre capital retido (o análogo do nosso ROIC medido)", "BB: exposição agro e risco político como cenário com peso, não nota de rodapé", "Basileia: quem tem capital para pagar e quem vai precisar reter"], "cfg": {"yield_real": false, "benchmark": "custo de capital próprio (Ke)", "capital": "patrimônio de referência (capital regulatório)", "duracao": "durabilidade da base de depósitos", "modelo": "Gordon sobre ROE: P/VP = (ROE−g)/(Ke−g)", "alerta": "Lucro de pico antes de ciclo de crédito ruim é a armadilha clássica"}}, {"id": "seguros", "nome": "Seguros", "status": "pendente", "bloco": 2, "universo": ["BBSE3", "CXSE3", "PSSA3"], "racional": "ROE altíssimo com capital leve. O teste de 'quem reinveste melhor' fica especialmente revelador.", "aprof": ["Separar resultado de underwriting do resultado financeiro — quanto do lucro é só Selic alta", "Sinistralidade normalizada por ciclo (seca no agro para BBSE, por exemplo)", "O que acontece com o ROE se a Selic for a 10% — sensibilidade explícita", "Distribuição: dependência do canal bancário e risco de renegociação"], "cfg": {"yield_real": false, "benchmark": "custo de capital próprio", "capital": "PL ajustado por reservas", "duracao": "duração do passivo segurado", "modelo": "Gordon sobre ROE", "alerta": ""}}, {"id": "shoppings", "nome": "Shoppings & Propriedades", "status": "pendente", "bloco": 2, "universo": ["MULT3", "IGTI11", "ALSO3", "HBRE3"], "racional": " const f=(n,d=1)=>n.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
let mkt='b3', sec='visao', REQ={};
const $=id=>document.getElementById(id);
const P={comprar:['c','comprar'],manter:['m','manter'],passar:['x','passar']};
const PS={aberta:['b','aberta'],verificar:['m','verificar'],acertou:['c','acertou'],errou:['x','errou']};

function valor(l,po,rc,r){if(rc<=.02||r<=.021)return NaN;
 const g=Math.min((1-po)*rc,.12),pt=Math.max(po,1-.02/rc);let pv=0,e=l;
 for(let t=1;t<=10;t++){e*=(1+g);pv+=e*po/Math.pow(1+r,t);}
 return pv+e*1.02*pt/(r-.02)/Math.pow(1+r,10);}

function render(){
 const M=DATA.mercados[mkt];
 $('sub').textContent='Preços de '+DATA.meta.precos+' · revisão '+DATA.meta.revisao.freq+' · medir, não supor';
 $('mkt').innerHTML=Object.entries(DATA.mercados).map(([k,m])=>
  `<button class="${k===mkt?'on':''}" onclick="setMkt('${k}')">${m.nome}</button>`).join('');
 const done=M.setores.filter(s=>s.status==='completo').length;
 $('tabs').innerHTML=[`<button class="tab ${sec==='visao'?'on':''}" onclick="setSec('visao')">Visão geral</button>`]
  .concat(M.setores.map(s=>`<button class="tab ${sec===s.id?'on':''}" onclick="setSec('${s.id}')">
   <span class="dot ${s.status==='completo'?'c':'p'}"></span>${s.nome}</button>`)).join('');
 $('view').innerHTML = sec==='visao' ? vGeral(M,done) :
  (M.setores.find(s=>s.id===sec).status==='completo' ? vCompleto(M.setores.find(s=>s.id===sec))
   : vPendente(M.setores.find(s=>s.id===sec)));
 if(sec!=='visao'){const s=M.setores.find(x=>x.id===sec);
  if(s.status==='completo'){const r=$('rq');if(r){r.oninput=()=>{REQ[s.id]=+r.value;drawSetor(s);};drawSetor(s);}}}
}
function setMkt(k){mkt=k;sec='visao';render();window.scrollTo(0,0);}
function setSec(k){sec=k;render();window.scrollTo(0,0);}
function tiles(items){return `<div class="tiles">`+items.map(([k,v,n])=>
 `<div class="tl"><div class="k">${k}</div><div class="v">${v}</div><div class="n">${n}</div></div>`).join('')+`</div>`;}
function media(s){return s.acoes.reduce((q,a)=>q+a.pr,0)/s.acoes.length;}

function vGeral(M,done){
 const comp=M.setores.filter(s=>s.status==='completo');
 let h=tiles(M.macro.itens)+`<div class="card"><h2>Cobertura — ${M.nome}</h2>
 <p class="hint">${done} de ${M.setores.length} setores analisados. Cada aba pendente traz a adaptação
 metodológica, o que aprofundar e o prompt pronto — uma conversa por setor.</p>`;
 if(comp.length){
  const rows=comp.flatMap(s=>s.acoes.filter(a=>a.v==='comprar').map(a=>({...a,setor:s.nome})));
  h+=`<h3>Prêmio de risco por setor analisado</h3>`;
  const mx=Math.max(...comp.map(s=>Math.abs(media(s))))||1;
  h+=comp.map(s=>{const m=media(s);return `<div class="row"><span class="l">${s.nome}</span>
   <div class="bar"><i style="width:${Math.abs(m)/mx*100}%;background:${m>=0?'var(--pos)':'var(--neg)'}"></i></div>
   <span class="v">${m>0?'+':''}${f(m)} pp</span></div>`;}).join('');
  h+=`<h3>Compras ativas em todos os setores</h3><div class="scroll"><table><thead><tr>
  <th>Ação</th><th>Setor</th><th>Preço</th><th>Justo</th><th>Upside</th><th>Prêmio</th></tr></thead><tbody>`+
  (rows.length?rows.map(a=>`<tr><td><b>${a.t}</b></td><td style="text-align:left">${a.setor}</td>
   <td>${f(a.px,2)}</td><td>${f(a.pj,2)}</td><td class="up">+${a.up}%</td><td class="up">+${f(a.pr)}</td></tr>`).join('')
   :`<tr><td colspan="6" style="color:var(--mut)">nenhuma ainda</td></tr>`)+`</tbody></table></div>`;
 } else {
  h+=`<p>Nenhum setor analisado neste mercado ainda. Os parâmetros macro serão fixados na primeira análise.</p>`;
 }
 h+=`</div><div class="card"><h2>Revisão mensal</h2>
 <p><b>${DATA.meta.revisao.ativa?'Ativa':'Inativa'}</b> — ${DATA.meta.revisao.freq}. Escopo:
 ${DATA.meta.revisao.escopo}. As <b>previsões registradas</b> em cada setor analisado são conferidas a cada
 ciclo: previsão que erra é registrada como errada, não apagada — é assim que o método aprende.</p>
 <div class="warn"><b>Números só entram por análise completa.</b> Abas pendentes mostram universo,
 adaptação e aprofundamentos, não estimativas.</div></div>`;
 return h;
}

function vCompleto(s){
 REQ[s.id]=REQ[s.id]||s.req;
 return tiles([["Análise",s.data,"fundamentos"],["Preços",s.precos.split(' ')[0],"cotações da tela"],
  ["Benchmark",s.rf?("IPCA+"+f(s.rf,2)+"%"):"—",s.cfg.benchmark],
  ["Prêmio médio",(media(s)>0?'+':'')+f(media(s))+" pp","do setor"]])+
 `<div class="card"><h2>${s.nome} — síntese</h2><p>${s.resumo}</p>
 ${s.cfg.alerta?`<div class="warn"><b>Atenção:</b> ${s.cfg.alerta}.</div>`:''}</div>
 <div class="ctl"><label for="rq">Retorno real exigido</label>
 <input type="range" id="rq" min="7.5" max="14" step="0.1" value="${REQ[s.id]}"><span class="big" id="rv"></span></div>
 <div class="card"><h2>Ranking</h2><p class="hint">Preços de ${s.precos}. Justo e upside recalculam com o slider; clique no cabeçalho para ordenar.</p>
 <div class="scroll"><table id="tb"><thead><tr><th data-k="t">Ação</th><th data-k="px">Preço</th>
 <th data-k="tir">TIR real</th><th data-k="pr">Prêmio</th><th data-k="roic">ROIC real</th><th data-k="dy">DY</th>
 <th data-k="pj">Justo</th><th data-k="up">Upside</th><th data-k="risco">Risco</th><th data-k="v">Veredito</th>
 </tr></thead><tbody id="tby"></tbody></table></div></div>
 <div class="card"><h2>Previsões registradas</h2>
 <p class="hint">Falsificáveis de propósito — a revisão mensal marca cada uma como acertou ou errou.</p>
 ${s.previsoes.map(pv=>{const q=PS[pv.st];return `<div class="prev"><div><div class="tx">${pv.p}</div>
  <div class="mt">prazo: ${pv.prazo}</div></div><span class="pill ${q[0]}">${q[1]}</span></div>`;}).join('')}</div>
 <div class="card"><h2>Ativo por ativo</h2><p class="hint">Toque para expandir. Vereditos da análise de ${s.data}; números a preço atual.</p><div id="lista"></div></div>
 <div class="card"><h2>Próxima revisão — o que aprofundar</h2>
 <ul>${s.aprof.map(p=>`<li>${p}</li>`).join('')}</ul>
 <h3>Pendências conhecidas</h3><ul>${s.pendencias.map(p=>`<li>${p}</li>`).join('')}</ul></div>`;
}
let sk='pr',sd=-1;
function drawSetor(s){
 const r=REQ[s.id]; $('rv').textContent=f(r)+'%';
 s.acoes.forEach(a=>{a.pjx=valor(a._l,a._po,a._r,r/100);a.upx=(a.pjx/a.px-1)*100;});
 const rows=[...s.acoes].sort((x,y)=>{const v=(x[sk]>y[sk]?1:x[sk]<y[sk]?-1:0);return v*sd;});
 $('tby').innerHTML=rows.map(a=>{const p=P[a.v];return `<tr><td><b>${a.t}</b></td><td>${f(a.px,2)}</td>
  <td>${f(a.tir)}%</td><td class="${a.pr>0?'up':'dn'}">${a.pr>0?'+':''}${f(a.pr)}</td>
  <td>${a.roic===null?'n/d':f(a.roic)+'%'}</td><td>${f(a.dy)}%</td>
  <td>${isNaN(a.pjx)?'—':f(a.pjx,2)}</td>
  <td class="${a.upx>0?'up':'dn'}">${isNaN(a.upx)?'—':(a.upx>0?'+':'')+a.upx.toFixed(0)+'%'}</td>
  <td>${a.risco}/10</td><td><span class="pill ${p[0]}">${p[1]}</span></td></tr>`;}).join('');
 document.querySelectorAll('#tb th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;
  sd=(k===sk)?-sd:-1;sk=k;drawSetor(s);});
 $('lista').innerHTML=[...s.acoes].sort((x,y)=>y.nota-x.nota).map(a=>{const p=P[a.v];
  return `<details><summary><span class="tk">${a.t}</span><span class="nm">${a.n} · ${a.s}</span>
  <span class="px">R$ ${f(a.px,2)}</span><span class="pill ${p[0]}">${p[1]}</span></summary>
  <div class="det"><div class="lbl p">A favor</div><ul>${a.pro.map(x=>`<li>${x}</li>`).join('')}</ul>
  <div class="lbl n">Contra</div><ul>${a.con.map(x=>`<li>${x}</li>`).join('')}</ul>
  <div class="res"><b>Veredito.</b> ${a.res}</div></div></details>`;}).join('');
}

Leia adaptacao-setorial.md primeiro. Adaptações deste setor:
- Yield: ${s.cfg.yield_real?'REAL (repasse contratual de inflação)':'NOMINAL (sem repasse automático)'}

Aprofundar além do método: ${s.aprof.map((x,i)=>(i+1)+') '+x).join(' ')}
Universo inicial (CONFIRMAR se ainda negociam): ${s.universo.join(', ')}
Use PREÇOS ATUAIS de mercado (confirmar data da cotação) e registre PREVISÕES falsificáveis
com prazo — a revisão mensal vai conferi-las.
Objetivo: equilíbrio entre dividendos e valorização.
Entrega: atualizar plataforma.html do projeto com este setor preenchido (ver metodo/plataforma-como-atualizar.md).`;
 return `<div class="card"><h2>${s.nome} <span class="pill m" style="margin-left:6px">pendente</span></h2>
 <p>${s.racional}</p>
 <h3>Universo inicial</h3><div class="chips">${s.universo.map(u=>`<span class="chip">${u}</span>`).join('')}</div>
 <p class="hint">Confirmar no início se todos ainda negociam — no elétrico, duas tinham saído da bolsa
 e uma trocou de ticker sem os agregadores perceberem.</p>
 <h3>Adaptação metodológica</h3><table class="cfgt">
 <tr><td>Earnings yield</td><td>${s.cfg.yield_real?'<b>Real</b> — comparável a título indexado':'<b>Nominal</b> — comparar com prefixado'}</td></tr>
 <tr><td>Benchmark</td><td>${s.cfg.benchmark}</td></tr>
 <tr><td>Capital investido</td><td>${s.cfg.capital}</td></tr>
 <tr><td>Duração</td><td>${s.cfg.duracao}</td></tr>
 <tr><td>Modelo</td><td>${s.cfg.modelo}</td></tr>
 ${s.cfg.alerta?`<tr><td>Armadilha</td><td>${s.cfg.alerta}</td></tr>`:''}</table>
 <h3>O que aprofundar além do método</h3>
 <ul>${s.aprof.map(p=>`<li>${p}</li>`).join('')}</ul>
 <h3>Para abrir a conversa deste setor</h3>
 <div class="prompt" id="pr-${s.id}">${pr}</div>
 <button class="copy" onclick="cp('pr-${s.id}',this)">Copiar prompt</button></div>`;
}
function cp(id,btn){const t=$(id).innerText;
 (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(
  ()=>{btn.textContent='Copiado ✓';setTimeout(()=>btn.textContent='Copiar prompt',1600);},
  ()=>{const r=document.createRange();r.selectNodeContents($(id));
   const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent='Selecionado — copie manualmente';});}
function tg(){const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';}
render();
</script></body></html>
